name: Publish current build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project
        shell: powershell
        run: .\scripts\Validate-XVV.ps1
      - name: Create clean user package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path package\XVV | Out-Null
          @('Start-XVV.bat', 'Start-XVV.ps1', 'XVV.ps1', 'README.md', 'LICENSE') |
            ForEach-Object { Copy-Item $_ package\XVV -Force }
          @('data', 'src') |
            ForEach-Object { Copy-Item $_ package\XVV -Recurse -Force }
          Compress-Archive -Path package\XVV -DestinationPath XVV-Windows.zip
      - name: Publish only the current package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: XVV for Windows
          body: Current stable XVV package. Eski deneme paketleri yayımlanmaz.
          make_latest: true
          overwrite_files: true
          files: XVV-Windows.zip
